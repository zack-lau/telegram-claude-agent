[package]
name = "aegis-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[[bin]]
name = "aegis-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id", "timeout"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto — KEM / AEAD / KDF
ml-kem = { version = "0.3", features = ["mlkem768"] }
p256 = { version = "0.13", features = ["ecdh", "pkcs8", "pem"] }
hkdf = "0.12"
aes-gcm = { version = "0.10", features = ["aes"] }
sha2 = "0.10"
rand = { version = "0.8", features = ["getrandom"] }
rand_core = "0.6"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2"                              # constant-time comparisons

# HPKE outer frame (RFC 9180)
hpke = { version = "0.11", features = ["alloc"] }

# OPAQUE (RFC 9807) — password-based key derivation
opaque-ke = "2"

# Ed25519 — for KeyBundle signing (Aegis CA)
ed25519-dalek = { version = "2", features = ["serde", "pkcs8"] }

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-kms = "1"

# JWT validation (Cognito access tokens)
jsonwebtoken = "9"

# Error handling
thiserror = "1"
anyhow = "1"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"

# HTTP client (JWKS fetch)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = { version = "0.14", features = ["env"] }

[dev-dependencies]
axum-test = "14"
tokio-test = "0.4"
mockall = "0.13"
hex-literal = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
