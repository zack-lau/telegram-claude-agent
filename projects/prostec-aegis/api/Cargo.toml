[package]
name = "aegis-api"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"

[lib]
name = "aegis_api"
path = "src/lib.rs"

[[bin]]
name = "aegis-api"
path = "src/main.rs"

[[bin]]
name = "aegis-oauth-refresh-worker"
path = "src/bin/oauth_refresh_worker.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "request-id", "timeout"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Crypto — FIPS 140-3 via AWS-LC (aws-lc-rs with fips feature)
# Covers everything: ML-KEM-768 (FIPS 203), AES-256-GCM (SP 800-38D),
# AES-256-KWP (SP 800-38F), ECDH P-256, ECDSA P-256, Ed25519 (FIPS 186-5),
# SHA-384 (FIPS 180-4), HKDF-SHA384 (SP 800-56C Rev.2).
# All primitives use AWS-LC's SP 800-90A DRBG via the FIPS module.
aws-lc-rs = { version = "1.16", features = ["fips"] }

zeroize = { version = "1.7", features = ["derive"] }

# AWS SDK
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-cognitoidentityprovider = "1"
aws-sdk-kms = "1"

# JWT validation (Cognito access tokens)
jsonwebtoken = "9"

# Error handling
thiserror = "1"
anyhow = "1"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"
opentelemetry = "0.21"

# HTTP client (JWKS fetch)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"

# Input validation
regex = "1"

[dev-dependencies]
axum-test = "14"
tokio-test = "0.4"
mockall = "0.13"
hex-literal = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
